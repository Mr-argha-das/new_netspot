{% extends "base.html" %}{% block content %}<section class="wrap narrow"><div class="card"><span class="pill">TEAM ZONE</span><h2>CREATE YOUR 4-PLAYER SQUAD</h2>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post" enctype="multipart/form-data"><div class="formgrid"><div class="field"><label>GAME *</label><select name="game" required><option>BGMI</option><option>Free Fire</option></select></div><div class="field"><label>TEAM NAME *</label><input name="team_name" required></div></div><div class="field"><label>TEAM LOGO — OPTIONAL</label><input type="file" name="logo" accept="image/png,image/jpeg,image/webp"></div><h3>PLAYER 1 — CAPTAIN</h3><p class="muted">{{user.name}} • {{user.game_profile_name}}</p><div class="players">{% for n in [2,3,4] %}<div class="slot"><h4>PLAYER {{n}}</h4><input name="p{{n}}_id" placeholder="Game ID" required><input name="p{{n}}_name" placeholder="Game Profile Name" required></div>{% endfor %}</div><button class="submit">SUBMIT TEAM →</button></form></div></section>{% endblock %}
