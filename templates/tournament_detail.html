{% extends "base.html" %}{% block content %}<section class="wrap narrow"><div class="card"><span class="pill">{{tournament.game}}</span><h2>{{tournament.name}}</h2><p>{{tournament.description}}</p><div class="meta"><div><small>ENTRY</small><b>₹{{tournament.entry_fee}}</b></div><div><small>PRIZE POOL</small><b>₹{{tournament.prize_pool}}</b></div></div>{% if request.session.get("user_id") %}<form method="post" action="/tournament/{{tournament.id}}/apply"><div class="field"><label>MY TEAM ID</label><input name="team_id" required placeholder="Enter your team ID from dashboard/admin"></div><button class="submit">APPLY WITH MY TEAM</button></form>{% else %}<a class="btn primary" href="/login">LOGIN TO APPLY</a>{% endif %}</div></section>{% endblock %}
