{% extends "base.html" %}{% block content %}<section class="wrap"><span class="pill">ADMIN</span><h2>APPLICATIONS</h2><div class="grid">{% for a in items %}<div class="card"><h3>{{a.team_id}}</h3><p>Tournament: {{a.tournament_id}}<br>Status: {{a.status}}</p><form method="post" action="/admin/applications/{{a.id}}/approve"><textarea name="note" placeholder="Admin note"></textarea><button class="btn primary">APPROVE</button></form><form method="post" action="/admin/applications/{{a.id}}/reject"><textarea name="note" placeholder="Rejection reason" required></textarea><button class="btn">REJECT</button></form></div>{% else %}<div class="card">No applications.</div>{% endfor %}</div></section>{% endblock %}
