{% extends "base.html" %}{% block content %}<section class="wrap"><span class="pill">ADMIN</span><h2>PAYMENTS</h2><div class="grid">{% for p in items %}<div class="card"><h3>{{p.user_id}}</h3><p>UTR: {{p.utr_id}}<br>Amount: ₹{{p.amount}}<br>Status: {{p.status}}</p><form method="post" action="/admin/payments/{{p.id}}/verify"><button class="btn primary">VERIFY</button></form><form method="post" action="/admin/payments/{{p.id}}/reject"><input name="note" placeholder="Reason" required><button class="btn">REJECT</button></form></div>{% else %}<div class="card">No payments.</div>{% endfor %}</div></section>{% endblock %}
