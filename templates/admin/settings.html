{% extends "base.html" %}{% block content %}<section class="wrap narrow"><div class="card"><span class="pill">ADMIN SETTINGS</span><h2>PAYMENT & SITE</h2><form method="post" enctype="multipart/form-data"><div class="field"><label>REGISTRATION AMOUNT</label><input name="registration_amount" value="{{settings.registration_amount}}"></div><div class="field"><label>PAYMENT QR</label><input name="qr" type="file" accept="image/*"></div><div class="field"><label>PAYMENT INSTRUCTIONS</label><textarea name="payment_instructions">{{settings.payment_instructions}}</textarea></div><div class="field"><label>SITE NAME</label><input name="site_name" value="{{settings.site_name}}"></div><div class="field"><label>HERO TITLE</label><input name="hero_title" value="{{settings.hero_title}}"></div><div class="field"><label>HERO DESCRIPTION</label><textarea name="hero_description">{{settings.hero_description}}</textarea></div><button class="submit">SAVE SETTINGS</button></form></div></section>{% endblock %}
